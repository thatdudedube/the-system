name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Assemble Android project from index.html
        run: |
          set -e
          A=android/app/src/main
          mkdir -p $A/java/uk/thesystem/app $A/assets $A/res/mipmap-xxxhdpi
          cp index.html $A/assets/index.html
          sed -i '/serviceWorker/d' $A/assets/index.html
          python3 - <<'PY'
          import re,base64
          s=open('index.html').read()
          m=re.search(r"const DEFAULT_AVATAR='data:image/jpeg;base64,([^']+)'",s)
          open('android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.jpg','wb').write(base64.b64decode(m.group(1)))
          PY
          cat > android/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "TheSystem"
          include ':app'
          EOF
          cat > android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF
          cat > android/gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g
          EOF
          cat > android/app/build.gradle <<'EOF'
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android {
              namespace 'uk.thesystem.app'
              compileSdk 34
              defaultConfig {
                  applicationId 'uk.thesystem.app'
                  minSdk 29
                  targetSdk 34
                  versionCode RUNNUM
                  versionName '1.RUNNUM'
              }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = '17' }
              signingConfigs {
                  fixed {
                      storeFile file('../../the-system.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
              buildTypes { debug { signingConfig signingConfigs.fixed } }
          }
          dependencies {
              implementation 'androidx.webkit:webkit:1.11.0'
              implementation 'androidx.activity:activity-ktx:1.9.2'
              implementation 'androidx.health.connect:connect-client:1.1.0-alpha07'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
          }
          EOF
          sed -i "s/RUNNUM/$GITHUB_RUN_NUMBER/g" android/app/build.gradle
          cat > $A/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.health.READ_STEPS"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-feature android:name="android.hardware.camera" android:required="false"/>
              <queries>
                  <package android:name="com.google.android.apps.healthdata"/>
              </queries>
              <application android:label="The System" android:icon="@mipmap/ic_launcher" android:allowBackup="true" android:supportsRtl="true" android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden|uiMode" android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                      <intent-filter>
                          <action android:name="androidx.health.ACTION_SHOW_PERMISSIONS_RATIONALE"/>
                      </intent-filter>
                  </activity>
                  <activity-alias android:name="ViewPermissionUsageActivity" android:exported="true" android:targetActivity=".MainActivity" android:permission="android.permission.START_VIEW_PERMISSION_USAGE">
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW_PERMISSION_USAGE"/>
                          <category android:name="android.intent.category.HEALTH_PERMISSIONS"/>
                      </intent-filter>
                  </activity-alias>
                  <receiver android:name=".QuickLogReceiver" android:exported="false">
                      <intent-filter><action android:name="uk.thesystem.QUICKLOG"/></intent-filter>
                  </receiver>
                  <receiver android:name=".ReminderReceiver" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.BOOT_COMPLETED"/></intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF
      - name: Write Android sources
        run: |
          A=android/app/src/main
          cat > $A/java/uk/thesystem/app/MainActivity.java <<'EOF'
          package uk.thesystem.app;

          import androidx.activity.ComponentActivity;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Message;
          import android.provider.MediaStore;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import androidx.annotation.NonNull;
          import androidx.webkit.WebViewAssetLoader;
          import androidx.webkit.WebViewClientCompat;
          import java.io.OutputStream;
          import android.Manifest;
          import android.os.Build;
          import android.content.SharedPreferences;

          public class MainActivity extends ComponentActivity {
              private StepsHelper steps;
              private android.webkit.PermissionRequest pendingCam;
              @Override
              public void onRequestPermissionsResult(int code, String[] perms, int[] results) {
                  super.onRequestPermissionsResult(code, perms, results);
                  if (code == 3 && pendingCam != null) {
                      if (results.length > 0 && results[0] == android.content.pm.PackageManager.PERMISSION_GRANTED) pendingCam.grant(pendingCam.getResources()); else pendingCam.deny();
                      pendingCam = null;
                  }
              }
              private static final String HOME = "https://appassets.androidplatform.net/assets/index.html";
              private static final int FILE_REQ = 1;
              private WebView web;
              private ValueCallback<Uri[]> fileCb;

              @Override
              protected void onCreate(Bundle saved) {
                  super.onCreate(saved);
                  steps = new StepsHelper(this, n -> { runOnUiThread(() -> web.evaluateJavascript("window.onSteps&&window.onSteps(" + n + ")", null)); return kotlin.Unit.INSTANCE; });
                  web = new WebView(this);
                  web.setBackgroundColor(0xFF070B18);
                  setContentView(web);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setSupportMultipleWindows(true);
                  s.setJavaScriptCanOpenWindowsAutomatically(true);

                  final WebViewAssetLoader loader = new WebViewAssetLoader.Builder()
                          .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                          .build();

                  web.setWebViewClient(new WebViewClientCompat() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r) {
                          return loader.shouldInterceptRequest(r.getUrl());
                      }
                      @Override
                      public boolean shouldOverrideUrlLoading(@NonNull WebView v, @NonNull WebResourceRequest r) {
                          Uri u = r.getUrl();
                          if ("appassets.androidplatform.net".equals(u.getHost())) return false;
                          openExternal(u);
                          return true;
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onCreateWindow(WebView v, boolean isDialog, boolean isUserGesture, Message msg) {
                          WebView tmp = new WebView(MainActivity.this);
                          tmp.setWebViewClient(new WebViewClient() {
                              @Override
                              public boolean shouldOverrideUrlLoading(WebView w, WebResourceRequest r) {
                                  openExternal(r.getUrl());
                                  return true;
                              }
                          });
                          ((WebView.WebViewTransport) msg.obj).setWebView(tmp);
                          msg.sendToTarget();
                          return true;
                      }
                      @Override
                      public void onPermissionRequest(final android.webkit.PermissionRequest req) {
                          runOnUiThread(() -> {
                              if (checkSelfPermission(Manifest.permission.CAMERA) == android.content.pm.PackageManager.PERMISSION_GRANTED) req.grant(req.getResources());
                              else { pendingCam = req; requestPermissions(new String[]{Manifest.permission.CAMERA}, 3); }
                          });
                      }
                      @Override
                      public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb, FileChooserParams params) {
                          if (fileCb != null) fileCb.onReceiveValue(null);
                          fileCb = cb;
                          try {
                              startActivityForResult(params.createIntent(), FILE_REQ);
                          } catch (Exception e) {
                              fileCb = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  web.addJavascriptInterface(new Bridge(), "Android");
                  if (Build.VERSION.SDK_INT >= 33) requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 2);
                  if (saved != null) web.restoreState(saved); else web.loadUrl(HOME);
              }

              private void openExternal(Uri u) {
                  try { startActivity(new Intent(Intent.ACTION_VIEW, u)); }
                  catch (Exception e) { Toast.makeText(this, "No app can open this link", Toast.LENGTH_SHORT).show(); }
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (web != null) web.evaluateJavascript("window.pullQuickLogs&&window.pullQuickLogs();window.refreshSteps&&window.Android&&window.Android.requestSteps&&window.Android.requestSteps()", null);
              }

              class Bridge {
                  @JavascriptInterface
                  public void requestSteps() { runOnUiThread(() -> steps.request()); }
                  @JavascriptInterface
                  public void setQuickLog(int on, int water, int teeth, int stairs, String date) {
                      SharedPreferences p = getSharedPreferences("quicklog", MODE_PRIVATE);
                      p.edit().putBoolean("on", on == 1).putString("date", date).putInt("base_water", water).putInt("base_teeth", teeth).putInt("base_stairs", stairs)
                          .putInt("add_water", 0).putInt("add_teeth", 0).putInt("add_stairs", 0).apply();
                      QuickLogReceiver.show(MainActivity.this);
                  }
                  @JavascriptInterface
                  public String pullQuickLogs() {
                      SharedPreferences p = getSharedPreferences("quicklog", MODE_PRIVATE);
                      String out = "{\"date\":\"" + p.getString("date", "") + "\",\"water\":" + p.getInt("add_water", 0) + ",\"teeth\":" + p.getInt("add_teeth", 0) + ",\"stairs\":" + p.getInt("add_stairs", 0) + "}";
                      p.edit().putInt("add_water", 0).putInt("add_teeth", 0).putInt("add_stairs", 0).apply();
                      return out;
                  }
                  @JavascriptInterface
                  public void setReminder(int on, int hour, int minute, String title, String text) {
                      SharedPreferences p = getSharedPreferences("reminder", MODE_PRIVATE);
                      p.edit().putBoolean("on", on == 1).putInt("h", hour).putInt("m", minute).putString("title", title).putString("text", text).apply();
                      ReminderReceiver.schedule(MainActivity.this);
                  }

                  @JavascriptInterface
                  public void saveFile(String name, String content) {
                      try {
                          ContentValues cv = new ContentValues();
                          cv.put(MediaStore.Downloads.DISPLAY_NAME, name);
                          cv.put(MediaStore.Downloads.MIME_TYPE, "application/json");
                          Uri u = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, cv);
                          OutputStream o = getContentResolver().openOutputStream(u);
                          o.write(content.getBytes("UTF-8"));
                          o.close();
                          runOnUiThread(() -> Toast.makeText(MainActivity.this, "Saved to Downloads/" + name, Toast.LENGTH_LONG).show());
                      } catch (Exception e) {
                          runOnUiThread(() -> Toast.makeText(MainActivity.this, "Could not save: " + e.getMessage(), Toast.LENGTH_LONG).show());
                      }
                  }
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  super.onActivityResult(req, res, data);
                  if (req == FILE_REQ && fileCb != null) {
                      fileCb.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(res, data));
                      fileCb = null;
                  }
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) web.goBack(); else super.onBackPressed();
              }

              @Override
              protected void onSaveInstanceState(Bundle out) {
                  super.onSaveInstanceState(out);
                  web.saveState(out);
              }
          }
          EOF
          cat > $A/java/uk/thesystem/app/StepsHelper.kt <<'EOF'
          package uk.thesystem.app

          import androidx.activity.ComponentActivity
          import androidx.activity.result.ActivityResultLauncher
          import androidx.health.connect.client.HealthConnectClient
          import androidx.health.connect.client.PermissionController
          import androidx.health.connect.client.permission.HealthPermission
          import androidx.health.connect.client.records.StepsRecord
          import androidx.health.connect.client.request.AggregateRequest
          import androidx.health.connect.client.time.TimeRangeFilter
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import java.time.Instant
          import java.time.LocalDate
          import java.time.ZoneId

          class StepsHelper(private val activity: ComponentActivity, private val onResult: (Long) -> Unit) {
              private val perms = setOf(HealthPermission.getReadPermission(StepsRecord::class))
              private val scope = CoroutineScope(Dispatchers.Main)
              private val launcher: ActivityResultLauncher<Set<String>> =
                  activity.registerForActivityResult(PermissionController.createRequestPermissionResultContract()) { granted ->
                      if (granted.containsAll(perms)) read() else onResult(-2)
                  }

              fun request() {
                  if (HealthConnectClient.getSdkStatus(activity) != HealthConnectClient.SDK_AVAILABLE) { onResult(-1); return }
                  val client = HealthConnectClient.getOrCreate(activity)
                  scope.launch {
                      try {
                          val granted = client.permissionController.getGrantedPermissions()
                          if (granted.containsAll(perms)) read() else launcher.launch(perms)
                      } catch (e: Exception) { onResult(-3) }
                  }
              }

              private fun read() {
                  val client = HealthConnectClient.getOrCreate(activity)
                  scope.launch {
                      try {
                          val zone = ZoneId.systemDefault()
                          val start = LocalDate.now(zone).atStartOfDay(zone).toInstant()
                          val r = client.aggregate(AggregateRequest(setOf(StepsRecord.COUNT_TOTAL), TimeRangeFilter.between(start, Instant.now())))
                          onResult(r[StepsRecord.COUNT_TOTAL] ?: 0L)
                      } catch (e: Exception) { onResult(-3) }
                  }
              }
          }
          EOF
          cat > $A/java/uk/thesystem/app/QuickLogReceiver.java <<'EOF'
          package uk.thesystem.app;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;

          public class QuickLogReceiver extends BroadcastReceiver {
              static final String CH = "quicklog";
              static final int ID = 2;

              static PendingIntent act(Context c, String key, int req) {
                  Intent i = new Intent(c, QuickLogReceiver.class).setAction("uk.thesystem.QUICKLOG").putExtra("key", key);
                  return PendingIntent.getBroadcast(c, req, i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              }

              public static void show(Context c) {
                  SharedPreferences p = c.getSharedPreferences("quicklog", Context.MODE_PRIVATE);
                  NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                  if (!p.getBoolean("on", true)) { nm.cancel(ID); return; }
                  NotificationChannel ch = new NotificationChannel(CH, "Quick log", NotificationManager.IMPORTANCE_LOW);
                  ch.setShowBadge(false);
                  nm.createNotificationChannel(ch);
                  int w = p.getInt("base_water", 0) + p.getInt("add_water", 0);
                  int t = p.getInt("base_teeth", 0) + p.getInt("add_teeth", 0);
                  int s = p.getInt("base_stairs", 0) + p.getInt("add_stairs", 0);
                  PendingIntent open = PendingIntent.getActivity(c, 0, new Intent(c, MainActivity.class), PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  Notification n = new Notification.Builder(c, CH)
                          .setSmallIcon(android.R.drawable.ic_menu_add)
                          .setContentTitle("The System · quick log")
                          .setContentText("Water " + w + "/8  ·  Teeth " + t + "/2  ·  Stairs " + s + "/20")
                          .setOngoing(true).setOnlyAlertOnce(true).setContentIntent(open)
                          .addAction(new Notification.Action.Builder(null, "Water +1", act(c, "water", 11)).build())
                          .addAction(new Notification.Action.Builder(null, "Teeth +1", act(c, "teeth", 12)).build())
                          .addAction(new Notification.Action.Builder(null, "Stairs +1", act(c, "stairs", 13)).build())
                          .build();
                  nm.notify(ID, n);
              }

              @Override
              public void onReceive(Context c, Intent i) {
                  if (Intent.ACTION_BOOT_COMPLETED.equals(i.getAction())) { show(c); return; }
                  String key = i.getStringExtra("key");
                  if (key == null) return;
                  SharedPreferences p = c.getSharedPreferences("quicklog", Context.MODE_PRIVATE);
                  String today = new java.text.SimpleDateFormat("yyyy-MM-dd", java.util.Locale.UK).format(new java.util.Date());
                  if (!today.equals(p.getString("date", ""))) {
                      p.edit().putString("date", today).putInt("base_water", 0).putInt("base_teeth", 0).putInt("base_stairs", 0)
                              .putInt("add_water", 0).putInt("add_teeth", 0).putInt("add_stairs", 0).apply();
                  }
                  p.edit().putInt("add_" + key, p.getInt("add_" + key, 0) + 1).apply();
                  show(c);
              }
          }
          EOF
          cat > $A/java/uk/thesystem/app/ReminderReceiver.java <<'EOF'
          package uk.thesystem.app;

          import android.app.AlarmManager;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import java.util.Calendar;

          public class ReminderReceiver extends BroadcastReceiver {
              static final String CH = "daily";

              public static void schedule(Context c) {
                  SharedPreferences p = c.getSharedPreferences("reminder", Context.MODE_PRIVATE);
                  AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
                  PendingIntent pi = PendingIntent.getBroadcast(c, 1, new Intent(c, ReminderReceiver.class), PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  am.cancel(pi);
                  if (!p.getBoolean("on", true)) return;
                  Calendar cal = Calendar.getInstance();
                  cal.set(Calendar.HOUR_OF_DAY, p.getInt("h", 21));
                  cal.set(Calendar.MINUTE, p.getInt("m", 0));
                  cal.set(Calendar.SECOND, 0);
                  if (cal.getTimeInMillis() <= System.currentTimeMillis()) cal.add(Calendar.DAY_OF_YEAR, 1);
                  am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, cal.getTimeInMillis(), pi);
              }

              @Override
              public void onReceive(Context c, Intent i) {
                  if (Intent.ACTION_BOOT_COMPLETED.equals(i.getAction())) { schedule(c); return; }
                  SharedPreferences p = c.getSharedPreferences("reminder", Context.MODE_PRIVATE);
                  NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                  nm.createNotificationChannel(new NotificationChannel(CH, "Daily reminder", NotificationManager.IMPORTANCE_DEFAULT));
                  PendingIntent open = PendingIntent.getActivity(c, 0, new Intent(c, MainActivity.class), PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  Notification n = new Notification.Builder(c, CH)
                          .setSmallIcon(android.R.drawable.ic_dialog_info)
                          .setContentTitle(p.getString("title", "The System"))
                          .setContentText(p.getString("text", "Daily quests close at midnight."))
                          .setStyle(new Notification.BigTextStyle().bigText(p.getString("text", "Daily quests close at midnight.")))
                          .setContentIntent(open).setAutoCancel(true).build();
                  nm.notify(1, n);
                  schedule(c);
              }
          }
          EOF
      - name: Check the signing key is present
        run: |
          test -f the-system.keystore || (echo "the-system.keystore missing from repo root" && exit 1)
          keytool -list -keystore the-system.keystore -storepass android | grep -i "sha-256" || true
      - name: Build debug APK
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.9 --no-daemon
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../the-system.apk
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          echo "APK signed with:"; $BT/apksigner verify --print-certs ../the-system.apk | grep -i sha-256
      - uses: actions/upload-artifact@v4
        with:
          name: the-system-apk
          path: the-system.apk
      - name: Publish as release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: The System v1.${{ github.run_number }}
          body: Download the-system.apk below and open it on your phone to install.
          files: the-system.apk
          make_latest: true
